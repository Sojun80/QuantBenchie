[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbenchie"
version = "0.1.0"
description = "Integrity evaluation for local LLM variants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "QuantBenchie contributors"}]
dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6.0"]
inspect = ["inspect-ai>=0.3"]
numeric = ["numpy>=1.24"]
dev = ["pytest>=7.0"]
all = ["PyYAML>=6.0", "inspect-ai>=0.3", "numpy>=1.24"]

[project.scripts]
quantbenchie = "quantbenchie.cli:main"

[tool.setuptools.packages.find]
include = ["quantbenchie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
